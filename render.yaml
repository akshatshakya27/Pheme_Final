services:
  - type: web
    name: pheme-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

  - type: static-site
    name: proctor-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pheme-final.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
